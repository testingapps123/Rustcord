[package]
name = "rustcord"
version = "0.2.0"
edition = "2021"
description = "A native Rust desktop client for Discord text chat (no web engine)"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "multipart", "cookies", "socks"] }
rfd = "0.15"
wry = "0.47"
egui-phosphor = "0.7"
xcap = "0.9"
nnnoiseless = "0.5"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_SystemInformation"] }
notify-rust = "4"
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "receive", "tungstenite", "native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
cpal = "0.15"
symphonia-core = "0.5"
# songbird needs symphonia's PCM decoder to read the live microphone stream
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
async-trait = "0.1"
openh264 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_extras ={ version = "0.29", features = ["http", "image", "gif"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
ab_glyph = "0.2"
unicode-segmentation = "1.13.3"
emojis = "0.9.1"
windows = { version = "0.58", features = ["implement", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Media_MediaFoundation", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.58"

# Local songbird copy with a Drover-style voice tweak (see vendor/songbird/src/driver/connection/mod.rs).
[patch.crates-io]
songbird = { path = "vendor/songbird" }

[profile.release]
opt-level = 3
lto = true
strip = true
